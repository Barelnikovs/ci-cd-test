name: GitHub Actions

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Run test
        run: npm run test

      - name: Build project
        run: npm run build

      - name: start production preview
        run: npm run preview &

      - name: start production preview
        run: npx wait-on http://localhost:4173

      - name: run Cypress
        run: npx cypress run
